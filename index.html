<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Game Technologie - Révision Brevet</title>
    <!-- Chargement des bibliothèques via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.5);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =========================================================================
        // BANQUE D'ÉNIGMES (Éditables par les élèves/professeurs)

                { q: "Quel est l'ancêtre d'Internet créé par l'armée américaine ?", r: "ARPANET", h: "Commence par A." },

                { q: "Quel objet permettait de stocker des données avant la clé USB ?", r: "DISQUETTE", h: "Elle était carrée et souple." },

                { q: "Quelle invention de 1885 a révolutionné le transport individuel ?", r: "AUTOMOBILE", h: "Carl Benz." },

                { q: "Qui a découvert la radioactivité ?", r: "MARIE CURIE", h: "Deux prix Nobel." },

            "Matériaux et Objets": [
                { q: "Quel métal est le meilleur conducteur électrique usuel ?", r: "CUIVRE", h: "De couleur orangée." },
                { q: "Comment appelle-t-on un mélange de fer et de carbone ?", r: "ACIER", h: "Utilisé dans le bâtiment." },

                { q: "Quelle propriété permet à un matériau de reprendre sa forme initiale ?", r: "ELASTICITE", h: "Comme un ressort." },
                { q: "Quel métal léger est massivement utilisé en aéronautique ?", r: "ALUMINIUM", h: "Symbole Al." },
                { q: "Comment appelle-t-on un matériau qui ne conduit pas l'électricité ?", r: "ISOLANT", h: "Contraire de conducteur." },
                { q: "À quelle famille appartiennent l'or, l'argent et le fer ?", r: "METAUX", h: "Ils sont brillants et conducteurs." },
                { q: "Quel est le terme pour un mélange de deux ou plusieurs métaux ?", r: "ALLIAGE", h: "Le bronze en est un." },
                { q: "Quelle propriété mesure la résistance à la rayure ?", r: "DURETE", h: "L'échelle de Mohs la mesure." },
                { q: "Comment appelle-t-on la dégradation des métaux par l'oxygène ?", r: "CORROSION", h: "La rouille en est une forme." },
                { q: "Quel matériau est issu de la cuisson de l'argile ?", r: "CERAMIQUE", h: "Utilisé pour la vaisselle." },
                { q: "Quel alliage de cuivre et de zinc est utilisé en décoration ?", r: "LAITON", h: "De couleur jaune." },
                { q: "Quel matériau naturel est composé de cellulose et de lignine ?", r: "BOIS", h: "Issu des arbres." },
                { q: "Quelle propriété désigne un matériau qui se casse sans se déformer ?", r: "FRAGILITE", h: "Comme le verre." },
                { q: "Quel matériau est capable d'être attiré par un aimant ?", r: "FERROMAGNETIQUE", h: "Le fer en est un." }
            ],
            "Énergie et Environnement": [
                { q: "Quelle machine transforme l'énergie du vent en électricité ?", r: "EOLIENNE", h: "Énergie cinétique de l'air." },
                { q: "Comment appelle-t-on l'énergie issue de la lumière du soleil ?", r: "PHOTOVOLTAIQUE", h: "Effet PV." },
                { q: "Quel est le principal gaz responsable de l'effet de serre ?", r: "CO2", h: "Dioxyde de carbone." },
                { q: "Citez une énergie fossile non renouvelable.", r: "PETROLE", h: "L'or noir." },
                { q: "Quelle est l'unité de mesure de la puissance électrique ?", r: "WATT", h: "Symbole W." },
                { q: "Comment appelle-t-on l'énergie produite par le mouvement de l'eau ?", r: "HYDRAULIQUE", h: "Barrages." },
                { q: "Quel minerai est utilisé comme combustible dans les centrales nucléaires ?", r: "URANIUM", h: "Symbole U." },
                { q: "Quel composant transforme un mouvement rotatif en électricité ?", r: "ALTERNATEUR", h: "Présent dans les éoliennes." },
                { q: "Quel dispositif permet de stocker l'énergie sous forme chimique ?", r: "BATTERIE", h: "Ou accumulateur." },
                { q: "Comment appelle-t-on l'énergie issue de la chaleur de la terre ?", r: "GEOTHERMIE", h: "Géo = Terre." },
                { q: "Quel terme désigne l'énergie issue de la combustion du bois ?", r: "BIOMASSE", h: "Matière organique." },
                { q: "Quel appareil capte la chaleur du soleil pour chauffer de l'eau ?", r: "CAPTEUR SOLAIRE", h: "Solaire thermique." },
                { q: "Comment appelle-t-on l'évaluation de l'impact CO2 d'un objet ?", r: "EMPREINTE CARBONE", h: "Mesure l'impact climat." },
                { q: "Quel est le but de l'isolation thermique dans une maison ?", r: "ECONOMISER L'ENERGIE", h: "Réduire les pertes." },
                { q: "Comment s'appelle le symbole universel du recyclage ?", r: "RUBAN DE MOEBIUS", h: "Boucle de 3 flèches." },
                { q: "Quel type d'énergie utilise la chaleur des volcans ?", r: "GEOTHERMIE", h: "Puissance de la terre." },
                { q: "Quel gaz est produit par la décomposition des déchets organiques ?", r: "METHANE", h: "CH4." },
                { q: "Comment appelle-t-on la transformation des déchets en nouveaux produits ?", r: "RECYCLAGE", h: "Économie circulaire." },
                { q: "Quelle unité mesure la consommation d'énergie sur une facture ?", r: "KWH", h: "Kilowatt-heure." },
                { q: "Quel phénomène réchauffe l'atmosphère à cause du CO2 ?", r: "EFFET DE SERRE", h: "Comme sous une vitre." }
            ],
            "Informatique et Programmation": [
                { q: "Quel langage permet d'ajouter de l'interactivité à une page web ?", r: "JAVASCRIPT", h: "JS." },
                { q: "Quel composant est considéré comme le 'cerveau' de l'ordinateur ?", r: "PROCESSEUR", h: "CPU." },
                { q: "Que signifie le sigle RAM ?", r: "MEMOIRE VIVE", h: "Mémoire à accès aléatoire." },
                { q: "Quel serveur traduit un nom de domaine en adresse IP ?", r: "DNS", h: "Domain Name System." },
                { q: "Comment appelle-t-on l'adresse unique d'une machine sur un réseau ?", r: "ADRESSE IP", h: "4 nombres séparés par des points." },
                { q: "Quel système de numération n'utilise que des 0 et des 1 ?", r: "BINAIRE", h: "Base 2." },
                { q: "Comment appelle-t-on une suite d'instructions qui se répète ?", r: "BOUCLE", h: "For ou While." },
                { q: "Quel mot clé introduit une condition dans un programme ?", r: "SI", h: "If en anglais." },
                { q: "Comment appelle-t-on une erreur dans un code informatique ?", r: "BUG", h: "Petit insecte en anglais." },
                { q: "Quel logiciel traduit le code source en langage machine ?", r: "COMPILATEUR", h: "Étape avant l'exécution." },
                { q: "Comment appelle-t-on un logiciel malveillant ?", r: "VIRUS", h: "Ou Malware." },
                { q: "Quel protocole permet une navigation web sécurisée ?", r: "HTTPS", h: "Avec un S pour Secure." },
                { q: "Comment appelle-t-on le stockage de données sur des serveurs distants ?", r: "CLOUD", h: "Le nuage." },
                { q: "Quel sigle désigne l'Intelligence Artificielle ?", r: "IA", h: "AI en anglais." },
                { q: "Quel objet physique permet de relier plusieurs ordinateurs en réseau ?", r: "SWITCH", h: "Ou commutateur." },
                { q: "Quel langage est utilisé pour structurer le contenu d'une page web ?", r: "HTML", h: "HyperText Markup Language." },
                { q: "Quel langage gère la mise en forme et le style d'un site ?", r: "CSS", h: "Cascading Style Sheets." },
                { q: "Que signifie URL ?", r: "ADRESSE WEB", h: "Uniform Resource Locator." },
                { q: "Quel petit fichier texte stocke vos préférences sur un site ?", r: "COOKIE", h: "Petit biscuit." },
                { q: "Quel algorithme permet de sécuriser les messages par cryptage ?", r: "CHIFFREMENT", h: "Protège la vie privée." }
            ]
        };

        // --- COMPOSANTS UI ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const Timer = ({ time }) => {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            return (
                <div className="font-orbitron text-2xl text-blue-400 neon-text">
                    {String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}
                </div>
            );
        };

        // --- APPLICATION PRINCIPALE ---
        function App() {
            const [step, setStep] = useState('home');
            const [currentRoomIdx, setCurrentRoomIdx] = useState(0);
            const [currentRiddleIdx, setCurrentRiddleIdx] = useState(0);
            const [timeLeft, setTimeLeft] = useState(600);
            const [userInput, setUserInput] = useState('');
            const [showHint, setShowHint] = useState(false);
            const [lockoutTime, setLockoutTime] = useState(null);

            const selectedRiddles = useMemo(() => {
                const result = {};
                Object.keys(BANQUE_ENIGMES).forEach(theme => {
                    result[theme] = [...BANQUE_ENIGMES[theme]]
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 4);
                });
                return result;
            }, []);

            const themes = Object.keys(selectedRiddles);

            useEffect(() => {
                let timer;
                if ((step === 'game' || step === 'room5') && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0 && (step === 'game' || step === 'room5')) {
                    setStep('fail');
                }
                return () => clearInterval(timer);
            }, [step, timeLeft]);

            useEffect(() => {
                const lastAttempt = localStorage.getItem('last_attempt_tech_escape');
                if (lastAttempt) {
                    const diff = Date.now() - parseInt(lastAttempt);
                    if (diff < 3600000) {
                        setLockoutTime(3600000 - diff);
                        setStep('lockout');
                    }
                }
            }, []);

            const startGaming = () => {
                localStorage.setItem('last_attempt_tech_escape', Date.now().toString());
                setStep('game');
                setTimeLeft(600);
                setCurrentRoomIdx(0);
                setCurrentRiddleIdx(0);
            };

            const handleAnswer = (e) => {
                e.preventDefault();
                const currentTheme = themes[currentRoomIdx];
                const currentRiddle = selectedRiddles[currentTheme][currentRiddleIdx];

                if (userInput.toUpperCase().trim() === currentRiddle.r.toUpperCase()) {
                    if (currentRiddleIdx < 3) {
                        setCurrentRiddleIdx(prev => prev + 1);
                        setUserInput('');
                        setShowHint(false);
                    } else {
                        if (currentRoomIdx < themes.length - 1) {
                            setCurrentRoomIdx(prev => prev + 1);
                            setCurrentRiddleIdx(0);
                            setUserInput('');
                            setShowHint(false);
                            setTimeLeft(600);
                        } else {
                            setStep('room5');
                            setTimeLeft(600);
                        }
                    }
                } else {
                    alert("Code incorrect ! Réessayez.");
                }
            };

            if (step === 'lockout') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="glass-panel p-8 rounded-2xl border-red-500/50 max-w-md text-center">
                            <Icon name="lock" className="w-16 h-16 text-red-500 mx-auto mb-4" />
                            <h2 className="text-2xl font-orbitron mb-4">SYSTÈME VERROUILLÉ</h2>
                            <p className="mb-6">Une tentative est déjà en cours. Pour éviter la triche, vous devez attendre 1 heure entre chaque essai.</p>
                            <div className="text-xl font-mono text-red-400">
                                Réessayez dans environ {Math.ceil(lockoutTime / 60000)} minutes.
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'home') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="text-center mb-12">
                            <h1 className="text-5xl md:text-7xl font-orbitron font-bold mb-4 neon-text text-blue-500">
                                ESCAPE TECH
                            </h1>
                            <p className="text-xl text-blue-300 tracking-widest animate-pulse-slow font-medium">RÉVISION BREVET TECHNOLOGIE</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl w-full">
                            <button
                                onClick={startGaming}
                                className="glass-panel p-8 rounded-2xl hover:neon-border transition-all group"
                            >
                                <Icon name="play" className="w-12 h-12 mb-4 text-green-400 group-hover:scale-110 transition-transform" />
                                <h2 className="text-2xl font-orbitron mb-2">DÉMARRER</h2>
                                <p className="text-slate-400">Lancez l'aventure. 5 thèmes, 10 minutes par salle.</p>
                            </button>

                            <button
                                onClick={() => setStep('guide')}
                                className="glass-panel p-8 rounded-2xl hover:neon-border transition-all group"
                            >
                                <Icon name="settings" className="w-12 h-12 mb-4 text-blue-400 group-hover:rotate-90 transition-transform" />
                                <h2 className="text-2xl font-orbitron mb-2">GUIDE / MODIF</h2>
                                <p className="text-slate-400">Apprendre à modifier le jeu et les énigmes.</p>
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'guide') {
                return (
                    <div className="min-h-screen p-8 max-w-4xl mx-auto">
                        <button onClick={() => setStep('home')} className="mb-8 flex items-center text-blue-400 hover:underline">
                            <Icon name="arrow-left" className="mr-2 w-4 h-4" /> Retour
                        </button>
                        <div className="glass-panel p-8 rounded-2xl space-y-8">
                            <h2 className="text-3xl font-orbitron text-blue-500">Guide de Modification</h2>
                            <div className="space-y-4">
                                <h3 className="text-xl font-bold">1. Changer les questions</h3>
                                <p>Cherchez la variable <code className="text-pink-400 font-bold">BANQUE_ENIGMES</code> dans le code source. Vous pouvez ajouter autant de questions que vous voulez dans chaque thème (actuellement 20 questions par thème pour plus de variété).</p>

                                <h3 className="text-xl font-bold">2. Changer le temps</h3>
                                <p>Modifiez la valeur de <code className="text-pink-400 font-bold">timeLeft</code> dans le code source (600 = 10 minutes).</p>

                                <h3 className="text-xl font-bold">3. Personnaliser les thèmes</h3>
                                <p>Vous pouvez changer les noms des thèmes et les icônes associées directement dans le code React.</p>
                            </div>
                            <div className="bg-blue-900/30 p-4 rounded-lg border border-blue-500/30">
                                <p className="text-sm italic">Note : Ce jeu est conçu pour être distribué comme un seul fichier HTML. Idéal pour les clés USB ou les ENT.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'game') {
                const currentTheme = themes[currentRoomIdx];
                const currentRiddle = selectedRiddles[currentTheme][currentRiddleIdx];
                const icons = ["microscope", "anvil", "zap", "cpu"];

                return (
                    <div className="min-h-screen p-4 flex flex-col items-center">
                        <div className="w-full max-w-4xl glass-panel p-6 rounded-2xl mb-8 flex justify-between items-center">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-blue-500/20 rounded-lg">
                                    <Icon name={icons[currentRoomIdx]} className="text-blue-500" />
                                </div>
                                <div>
                                    <h2 className="text-xl font-orbitron uppercase tracking-wider">{currentTheme}</h2>
                                    <p className="text-sm text-slate-400">Énigme {currentRiddleIdx + 1} / 4</p>
                                </div>
                            </div>
                            <Timer time={timeLeft} />
                        </div>

                        <div className="w-full max-w-3xl glass-panel p-12 rounded-3xl neon-border relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-5">
                                <Icon name="shield" className="w-32 h-32" />
                            </div>

                            <span className="text-xs font-orbitron text-blue-500 tracking-widest uppercase mb-4 block opacity-70">Identification Requise</span>
                            <h3 className="text-2xl md:text-3xl font-medium mb-8 leading-relaxed">
                                {currentRiddle.q}
                            </h3>

                            <form onSubmit={handleAnswer} className="space-y-6">
                                <input
                                    type="text"
                                    value={userInput}
                                    onChange={(e) => setUserInput(e.target.value)}
                                    placeholder="Réponse..."
                                    className="w-full bg-slate-900/50 border border-slate-700 p-4 rounded-xl focus:outline-none focus:border-blue-500 text-xl font-mono uppercase tracking-widest"
                                    autoFocus
                                />
                                <div className="flex space-x-4">
                                    <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/20">
                                        VALIDER
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowHint(true)}
                                        className="p-4 border border-slate-700 rounded-xl hover:bg-slate-800 transition-colors group"
                                    >
                                        <Icon name="lightbulb" className={showHint ? "text-yellow-400" : "text-slate-500 group-hover:text-yellow-400"} />
                                    </button>
                                </div>
                            </form>

                            {showHint && (
                                <div className="mt-6 p-4 bg-yellow-900/20 border border-yellow-700/50 rounded-lg text-yellow-200 animate-pulse font-medium">
                                    <span className="text-yellow-500 font-bold mr-2">INDICE :</span> {currentRiddle.h}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (step === 'room5') {
                return (
                    <div className="min-h-screen p-4 flex flex-col items-center">
                        <div className="w-full max-w-4xl glass-panel p-6 rounded-2xl mb-8 flex justify-between items-center border-purple-500/50">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-purple-500/20 rounded-lg">
                                    <Icon name="binary" className="text-purple-500" />
                                </div>
                                <h2 className="text-xl font-orbitron uppercase tracking-wider">Histoire du Codage</h2>
                            </div>
                            <Timer time={timeLeft} />
                        </div>

                        <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="glass-panel p-6 rounded-2xl">
                                <h3 className="text-xl font-orbitron text-purple-400 mb-6">Bibliothèque du Chiffrement</h3>
                                <div className="space-y-4 text-sm">
                                    <div className="p-4 bg-slate-900/50 rounded border-l-4 border-purple-500">
                                        <strong className="block text-purple-300 mb-1 font-orbitron">Scytale :</strong> Bâton autour duquel on enroule un ruban de cuir pour lire le message.
                                    </div>
                                    <div className="p-4 bg-slate-900/50 rounded border-l-4 border-purple-500">
                                        <strong className="block text-purple-300 mb-1 font-orbitron">César :</strong> Décalage de lettres (ex: décalage de +1, A devient B).
                                    </div>
                                    <div className="p-4 bg-slate-900/50 rounded border-l-4 border-purple-500">
                                        <strong className="block text-purple-300 mb-1 font-orbitron">Atbash :</strong> Alphabet inversé (A devient Z, B devient Y).
                                    </div>
                                    <div className="p-4 bg-slate-900/50 rounded border-l-4 border-purple-500">
                                        <strong className="block text-purple-300 mb-1 font-orbitron">Pigpen :</strong> Utilisation de symboles géométriques (Franc-Maçon).
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel p-6 rounded-2xl flex flex-col justify-center items-center text-center">
                                <Icon name="terminal" className="w-16 h-16 text-purple-500 mb-6" />
                                <h3 className="text-2xl font-orbitron mb-4">DÉCRYPTAGE FINAL</h3>
                                <p className="mb-8 text-slate-300 italic">"Le code secret a été chiffré par César avec un décalage de +1."</p>
                                <div className="bg-slate-900 p-6 rounded-lg font-mono text-3xl tracking-[1rem] mb-8 text-purple-400 shadow-inner border border-purple-500/20">
                                    CSFWFU
                                </div>
                                <div className="w-full">
                                    <input
                                        type="text"
                                        placeholder="MOT DÉCRYPTÉ"
                                        className="w-full bg-slate-800 border border-purple-500/50 p-4 rounded-xl text-center font-mono uppercase tracking-widest focus:border-purple-400 focus:outline-none transition-colors"
                                        onChange={(e) => {
                                            if (e.target.value.toUpperCase().trim() === "BREVET") {
                                                setStep('victory');
                                            }
                                        }}
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'victory') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 text-center">
                        <div className="max-w-2xl animate-in fade-in zoom-in duration-700">
                            <Icon name="trophy" className="w-32 h-32 text-yellow-400 mx-auto mb-8 animate-bounce" />
                            <h1 className="text-6xl font-orbitron font-bold text-white mb-4 neon-text">VICTOIRE !</h1>
                            <p className="text-2xl text-blue-300 mb-12">Vous avez piraté le système et validé vos connaissances technologiques.</p>
                            <div className="glass-panel p-8 rounded-2xl border-green-500/30">
                                <p className="text-slate-400 mb-2 uppercase tracking-widest text-sm">Score d'Efficacité</p>
                                <div className="text-5xl font-orbitron text-green-400 mb-8">{Math.floor(timeLeft / 10)}%</div>
                                <button
                                    onClick={() => window.location.reload()}
                                    className="px-12 py-4 bg-blue-600 rounded-full font-bold hover:bg-blue-500 transition-all transform hover:scale-105 shadow-xl shadow-blue-500/30"
                                >
                                    TERMINER
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'fail') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 text-center">
                        <div className="animate-in fade-in duration-500">
                            <Icon name="skull" className="w-32 h-32 text-red-500 mx-auto mb-8" />
                            <h1 className="text-6xl font-orbitron font-bold text-white mb-4">ÉCHEC</h1>
                            <p className="text-2xl text-slate-400 mb-12">Le système s'est auto-détruit. Temps écoulé.</p>
                            <button
                                onClick={() => window.location.reload()}
                                className="px-12 py-4 bg-red-600 rounded-full font-bold hover:bg-red-500 transition-all"
                            >
                                QUITTER
                            </button>
                        </div>
                    </div>
                );
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
