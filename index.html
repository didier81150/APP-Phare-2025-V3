<!doctype html>
<html lang="fr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Cyber Quiz</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
        body {
            box-sizing: border-box;
        }

        .question-card {
            transition: all 0.3s ease;
        }

        .option-btn {
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            transform: translateX(5px);
        }

        .correct {
            background-color: #10b981 !important;
            color: white !important;
        }

        .incorrect {
            background-color: #ef4444 !important;
            color: white !important;
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .7;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="w-full min-h-full">
  <div id="app" class="w-full min-h-full"></div>
  <script>
        const defaultConfig = {
            background_color: "#0f172a",
            surface_color: "#1e293b",
            text_color: "#f1f5f9",
            primary_action_color: "#3b82f6",
            secondary_action_color: "#64748b",
            font_family: "Inter",
            font_size: 16,
            quiz_title: "Quiz sur les Réseaux Informatiques",
            intro_text: "Bienvenue dans ce quiz sur les réseaux informatiques ! Teste tes connaissances sur les routeurs, les adresses IP, et bien plus encore. Tu as 30 minutes pour terminer. Bonne chance !",
            timer_label: "Temps restant"
        };

        const questions = [
            {
                id: 1,
                question: "Quelle est la différence fondamentale entre un commutateur (switch) et un routeur dans l'architecture d'un réseau d'entreprise ?",
                type: "multiple",
                options: [
                    "Le routeur assure la sécurité (pare-feu), tandis que le commutateur stocke les données des utilisateurs.",
                    "Le commutateur fournit l'accès à Internet, alors que le routeur distribue cet accès aux différents appareils.",
                    "Le commutateur gère les connexions sans fil (Wi-Fi) et le routeur gère les connexions filaires (Ethernet).",
                    "Le routeur relie plusieurs réseaux locaux entre eux, tandis que le commutateur relie des équipements au sein d'un même réseau local."
                ],
                correct: 3
            },
            {
                id: 2,
                question: "D'après les documents, qu'est-ce qui caractérise la structure d'une adresse IP ?",
                type: "multiple",
                options: [
                    "Elle est composée de 4 nombres, chacun étant compris entre 0 et 255.",
                    "Elle est formée de 8 groupes de nombres hexadécimaux.",
                    "Elle est composée de 4 mots de 16 bits chacun.",
                    "C'est une adresse textuelle unique comme une URL (par exemple, youtube.fr)."
                ],
                correct: 0
            },
            {
                id: 3,
                question: "En quoi un réseau WLAN se distingue-t-il fondamentalement d'un réseau WAN ?",
                type: "multiple",
                options: [
                    "Le WLAN est une catégorie de LAN, tandis que le WAN est une catégorie d'Internet.",
                    "Le WLAN utilise exclusivement des ondes radio, tandis que le WAN utilise uniquement la fibre optique.",
                    "Un WLAN est géré par un point d'accès, tandis qu'un WAN est géré par un serveur.",
                    "Le WLAN est un réseau sans fil de portée locale (maison, collège), alors que le WAN couvre une zone géographique très étendue (pays, continent)."
                ],
                correct: 3
            },
            {
                id: 4,
                question: "Quelle fonction spécifique justifie l'appellation de \"routeur\" dans un \"routeur Wi-Fi\" ?",
                type: "multiple",
                options: [
                    "Il relie directement les équipements au fournisseur d'accès à Internet.",
                    "Il choisit la meilleure \"route\" pour les ondes radio afin d'éviter les obstacles.",
                    "Il génère un sous-réseau local qui lui est propre.",
                    "Il permet de commuter la connexion entre plusieurs équipements sans fil."
                ],
                correct: 2
            },
            {
                id: 5,
                question: "Parmi les moyens de connexion filaire décrits, lequel utilise des impulsions lumineuses pour transmettre les données ?",
                type: "multiple",
                options: [
                    "Le câble Ethernet",
                    "Le Modem",
                    "La fibre optique",
                    "Le Courant Porteur en Ligne (CPL)"
                ],
                correct: 2
            },
            {
                id: 6,
                question: "Selon les documents, quelle tâche n'est PAS une fonction principale d'un serveur dans un réseau de collège ?",
                type: "multiple",
                options: [
                    "Établir l'interface de connexion entre le réseau et l'extérieur (Internet).",
                    "Gérer la sécurité des données qui transitent sur le réseau (pare-feu).",
                    "Stocker les données et les fichiers des utilisateurs.",
                    "Gérer les autorisations d'accès des utilisateurs."
                ],
                correct: 0
            },
            {
                id: 7,
                question: "Parmi les technologies de communication sans fil mentionnées, laquelle se distingue par l'utilisation d'impulsions lumineuses au lieu d'ondes radio ?",
                type: "multiple",
                options: [
                    "Le Li-Fi",
                    "Le Satellite",
                    "Le Bluetooth"
                ],
                correct: 0
            },
            {
                id: 8,
                question: "Quel est le rôle principal d'un \"point d'accès\" dans l'architecture d'un réseau ?",
                type: "multiple",
                options: [
                    "Gérer la sécurité et les autorisations des utilisateurs du réseau sans fil.",
                    "Relier plusieurs réseaux locaux de différents bâtiments ensemble.",
                    "Établir la liaison entre un réseau filaire et les terminaux d'un réseau sans fil.",
                    "Attribuer une adresse IP unique à chaque appareil connecté."
                ],
                correct: 2
            },
            {
                id: 9,
                question: "Dans un sous-réseau informatique comme celui de la \"Salle Techno 1\" du collège, qu'est-ce que les adresses IP des différents appareils ont en commun ?",
                type: "multiple",
                options: [
                    "Elles sont toutes supérieures à 255.",
                    "Le dernier nombre de leur adresse IP est toujours le même.",
                    "Elles sont toutes composées uniquement de nombres pairs.",
                    "Les premiers nombres de leur adresse IP sont identiques."
                ],
                correct: 3
            },
            {
                id: 10,
                question: "Quel équipement a pour fonction principale de connecter plusieurs équipements, comme des ordinateurs et des imprimantes, au sein d'un MÊME réseau local ?",
                type: "multiple",
                options: [
                    "Le routeur",
                    "Le serveur",
                    "Le modem",
                    "Le commutateur (switch)"
                ],
                correct: 3
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answers = [];
        let timeLeft = 1800;
        let timerInterval = null;
        let startTime = null;
        let quizState = "intro";
        let studentFirstName = "";
        let studentLastName = "";
        let studentClass = "";
        let matchingAnswers = {};

        async function initApp() {
            if (window.elementSdk) {
                await window.elementSdk.init({
                    defaultConfig,
                    onConfigChange: async (config) => {
                        updateUI(config);
                    },
                    mapToCapabilities: (config) => ({
                        recolorables: [
                            {
                                get: () => config.background_color || defaultConfig.background_color,
                                set: (value) => {
                                    config.background_color = value;
                                    window.elementSdk.setConfig({ background_color: value });
                                }
                            },
                            {
                                get: () => config.surface_color || defaultConfig.surface_color,
                                set: (value) => {
                                    config.surface_color = value;
                                    window.elementSdk.setConfig({ surface_color: value });
                                }
                            },
                            {
                                get: () => config.text_color || defaultConfig.text_color,
                                set: (value) => {
                                    config.text_color = value;
                                    window.elementSdk.setConfig({ text_color: value });
                                }
                            },
                            {
                                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                                set: (value) => {
                                    config.primary_action_color = value;
                                    window.elementSdk.setConfig({ primary_action_color: value });
                                }
                            },
                            {
                                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                                set: (value) => {
                                    config.secondary_action_color = value;
                                    window.elementSdk.setConfig({ secondary_action_color: value });
                                }
                            }
                        ],
                        borderables: [],
                        fontEditable: {
                            get: () => config.font_family || defaultConfig.font_family,
                            set: (value) => {
                                config.font_family = value;
                                window.elementSdk.setConfig({ font_family: value });
                            }
                        },
                        fontSizeable: {
                            get: () => config.font_size || defaultConfig.font_size,
                            set: (value) => {
                                config.font_size = value;
                                window.elementSdk.setConfig({ font_size: value });
                            }
                        }
                    }),
                    mapToEditPanelValues: (config) => new Map([
                        ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
                        ["intro_text", config.intro_text || defaultConfig.intro_text],
                        ["timer_label", config.timer_label || defaultConfig.timer_label]
                    ])
                });
            }

            render();
        }

        function updateUI(config) {
            const fontFamily = config.font_family || defaultConfig.font_family;
            const fontSize = config.font_size || defaultConfig.font_size;
            const backgroundColor = config.background_color || defaultConfig.background_color;
            const surfaceColor = config.surface_color || defaultConfig.surface_color;
            const textColor = config.text_color || defaultConfig.text_color;
            const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
            const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

            document.body.style.fontFamily = `${fontFamily}, sans-serif`;
            document.body.style.backgroundColor = backgroundColor;
            document.body.style.color = textColor;

            const appElement = document.getElementById('app');
            if (appElement) {
                appElement.style.backgroundColor = backgroundColor;
            }

            const surfaces = document.querySelectorAll('.surface');
            surfaces.forEach(el => el.style.backgroundColor = surfaceColor);

            const titles = document.querySelectorAll('.title');
            titles.forEach(el => {
                el.style.fontSize = `${fontSize * 2}px`;
                el.style.color = textColor;
            });

            const subtitles = document.querySelectorAll('.subtitle');
            subtitles.forEach(el => {
                el.style.fontSize = `${fontSize * 1.25}px`;
                el.style.color = textColor;
            });

            const bodyTexts = document.querySelectorAll('.body-text');
            bodyTexts.forEach(el => {
                el.style.fontSize = `${fontSize}px`;
                el.style.color = textColor;
            });

            const primaryButtons = document.querySelectorAll('.primary-btn');
            primaryButtons.forEach(el => {
                el.style.backgroundColor = primaryColor;
                el.style.fontSize = `${fontSize}px`;
            });

            const secondaryButtons = document.querySelectorAll('.secondary-btn');
            secondaryButtons.forEach(el => {
                el.style.backgroundColor = secondaryColor;
                el.style.fontSize = `${fontSize * 0.9}px`;
            });

            const optionButtons = document.querySelectorAll('.option-btn:not(.correct):not(.incorrect)');
            optionButtons.forEach(el => {
                el.style.backgroundColor = surfaceColor;
                el.style.color = textColor;
                el.style.fontSize = `${fontSize}px`;
            });

            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.style.color = textColor;
                timerElement.style.fontSize = `${fontSize * 1.25}px`;
            }

            const progressText = document.getElementById('progress-text');
            if (progressText) {
                progressText.style.color = textColor;
                progressText.style.fontSize = `${fontSize * 0.9}px`;
            }
        }

        function render() {
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            const app = document.getElementById('app');

            if (quizState === "intro") {
                app.innerHTML = `
                    <div class="w-full min-h-full flex items-center justify-center p-8">
                        <div class="surface max-w-2xl w-full rounded-2xl shadow-2xl p-12">
                            <div class="text-center mb-8">
                                <div class="text-6xl mb-6">🛡️</div>
                                <h1 class="title font-bold mb-4">${config.quiz_title || defaultConfig.quiz_title}</h1>
                                <p class="body-text mb-8">${config.intro_text || defaultConfig.intro_text}</p>
                            </div>
                            <div class="mb-8 space-y-4">
                                <div>
                                    <label for="firstname-input" class="body-text block mb-2 font-semibold">Ton prénom :</label>
                                    <input type="text" id="firstname-input" placeholder="Entre ton prénom" class="w-full px-4 py-3 rounded-lg border-2 border-gray-600 bg-gray-800 focus:outline-none focus:border-blue-500" />
                                </div>
                                <div>
                                    <label for="lastname-input" class="body-text block mb-2 font-semibold">Ton nom :</label>
                                    <input type="text" id="lastname-input" placeholder="Entre ton nom" class="w-full px-4 py-3 rounded-lg border-2 border-gray-600 bg-gray-800 focus:outline-none focus:border-blue-500" />
                                </div>
                                <div>
                                    <label for="class-input" class="body-text block mb-2 font-semibold">Ta classe :</label>
                                    <input type="text" id="class-input" placeholder="Entre ta classe" class="w-full px-4 py-3 rounded-lg border-2 border-gray-600 bg-gray-800 focus:outline-none focus:border-blue-500" />
                                </div>
                            </div>
                            <button
                                id="start-btn"
                                class="primary-btn w-full py-4 rounded-lg font-bold hover:opacity-90 transition"
                            >
                                Commencer la Mission 🚀
                            </button>
                        </div>
                    </div>
                `;

                document.getElementById('start-btn').addEventListener('click', startQuiz);
                document.getElementById('firstname-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') startQuiz();
                });
                document.getElementById('lastname-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') startQuiz();
                });
                document.getElementById('class-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') startQuiz();
                });
            } else if (quizState === "quiz") {
                renderQuiz();
            } else if (quizState === "results") {
                renderResults();
            }

            updateUI(config);
        }

        function startQuiz() {
            const firstNameInput = document.getElementById('firstname-input');
            const lastNameInput = document.getElementById('lastname-input');
            const classInput = document.getElementById('class-input');

            studentFirstName = firstNameInput.value.trim();
            studentLastName = lastNameInput.value.trim();
            studentClass = classInput.value.trim();

            let isValid = true;
            if (!studentFirstName) {
                isValid = false;
                firstNameInput.style.borderColor = '#ef4444';
            } else {
                firstNameInput.style.borderColor = '';
            }
            if (!studentLastName) {
                isValid = false;
                lastNameInput.style.borderColor = '#ef4444';
            } else {
                lastNameInput.style.borderColor = '';
            }
            if (!studentClass) {
                isValid = false;
                classInput.style.borderColor = '#ef4444';
            } else {
                classInput.style.borderColor = '';
            }

            if (!isValid) {
                let feedback = document.getElementById('start-feedback');
                if (!feedback) {
                    feedback = document.createElement('p');
                    feedback.id = 'start-feedback';
                    feedback.className = 'body-text mt-2';
                    feedback.style.color = '#ef4444';
                    const startButton = document.getElementById('start-btn');
                    startButton.parentElement.insertBefore(feedback, startButton.nextSibling);
                }
                feedback.textContent = 'Veuillez remplir tous les champs pour commencer !';
                return;
            }

            quizState = "quiz";
            startTime = Date.now();
            startTimer();
            render();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerElement = document.getElementById('timer');
            if (timerElement) {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 60) {
                    timerElement.classList.add('pulse');
                    timerElement.style.color = '#ef4444';
                }
            }
        }

        function renderQuiz() {
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
            const app = document.getElementById('app');
            const q = questions[currentQuestion];

            app.innerHTML = `
                <div class="w-full min-h-full p-8">
                    <div class="max-w-4xl mx-auto">
                        <div class="surface rounded-xl shadow-lg p-6 mb-6">
                            <div class="flex justify-between items-center">
                                <div>
                                    <p id="progress-text" class="font-semibold">Question ${currentQuestion + 1}/${questions.length}</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="body-text">${config.timer_label || defaultConfig.timer_label} :</span>
                                    <span id="timer" class="subtitle font-bold"></span>
                                </div>
                            </div>
                            <div class="w-full bg-gray-700 h-2 rounded-full mt-4">
                                <div class="h-full rounded-full transition-all duration-300"
                                     style="width: ${((currentQuestion + 1) / questions.length) * 100}%; background-color: ${config.primary_action_color || defaultConfig.primary_action_color}">
                                </div>
                            </div>
                        </div>

                        <div class="surface question-card rounded-2xl shadow-2xl p-8">
                            <h2 class="subtitle font-bold mb-6">${q.question}</h2>
                            <div id="question-content"></div>
                            <div id="feedback" class="mt-6"></div>
                        </div>
                    </div>
                </div>
            `;

            updateTimerDisplay();
            renderQuestion(q);
            updateUI(config);
        }

        function renderQuestion(q) {
            const content = document.getElementById('question-content');

            if (q.type === "multiple") {
                content.innerHTML = q.options.map((option, index) => `
                    <button
                        class="option-btn w-full text-left px-6 py-4 rounded-lg mb-3 border-2 border-gray-600 hover:border-blue-500"
                        data-index="${index}"
                    >
                        ${option}
                    </button>
                `).join('');

                content.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleMultipleChoice(parseInt(btn.dataset.index)));
                });
            } else if (q.type === "boolean") {
                content.innerHTML = `
                    <div class="flex gap-4">
                        <button class="option-btn flex-1 px-6 py-4 rounded-lg border-2 border-gray-600 hover:border-blue-500" data-answer="true">
                            Vrai ✓
                        </button>
                        <button class="option-btn flex-1 px-6 py-4 rounded-lg border-2 border-gray-600 hover:border-blue-500" data-answer="false">
                            Faux ✗
                        </button>
                    </div>
                `;

                content.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleBoolean(btn.dataset.answer === 'true'));
                });
            } else if (q.type === "text") {
                content.innerHTML = `
                    <input
                        type="text"
                        id="text-answer"
                        placeholder="Ta réponse..."
                        class="w-full px-4 py-3 rounded-lg border-2 border-gray-600 bg-gray-800 focus:outline-none focus:border-blue-500 mb-4"
                    />
                    <button id="submit-text" class="primary-btn px-8 py-3 rounded-lg font-bold hover:opacity-90">
                        Valider
                    </button>
                `;

                document.getElementById('submit-text').addEventListener('click', handleTextAnswer);
                document.getElementById('text-answer').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleTextAnswer();
                });
            } else if (q.type === "matching") {
                matchingAnswers = {};
                content.innerHTML = `
                    ${q.pairs.map((pair, index) => `
                        <div class="mb-4 p-4 rounded-lg border-2 border-gray-600">
                            <p class="body-text font-semibold mb-2">${pair.term}</p>
                            <select class="w-full px-4 py-2 rounded-lg bg-gray-800 border-2 border-gray-600" data-term="${pair.term}">
                                <option value="">Choisir une définition...</option>
                                ${q.pairs.map(p => `<option value="${p.definition}">${p.definition}</option>`).join('')}
                            </select>
                        </div>
                    `).join('')}
                    <button id="submit-matching" class="primary-btn px-8 py-3 rounded-lg font-bold hover:opacity-90 mt-4">
                        Valider
                    </button>
                `;

                content.querySelectorAll('select').forEach(select => {
                    select.addEventListener('change', (e) => {
                        matchingAnswers[e.target.dataset.term] = e.target.value;
                    });
                });

                document.getElementById('submit-matching').addEventListener('click', handleMatching);
            }
        }

        function handleMultipleChoice(index) {
            const q = questions[currentQuestion];
            const isCorrect = index === q.correct;

            answers.push({ question: q.id, correct: isCorrect });
            if (isCorrect) score++;

            showFeedback(isCorrect, q.options[q.correct]);

            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) {
                    btn.classList.add('correct');
                } else if (i === index && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            setTimeout(nextQuestion, 2000);
        }

        function handleBoolean(answer) {
            const q = questions[currentQuestion];
            const isCorrect = answer === q.correct;

            answers.push({ question: q.id, correct: isCorrect });
            if (isCorrect) score++;

            showFeedback(isCorrect, q.correct ? "Vrai" : "Faux");

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                const btnAnswer = btn.dataset.answer === 'true';
                if (btnAnswer === q.correct) {
                    btn.classList.add('correct');
                } else if (btnAnswer === answer && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            setTimeout(nextQuestion, 2000);
        }

        function handleTextAnswer() {
            const input = document.getElementById('text-answer');
            const answer = input.value.trim().toUpperCase();
            const q = questions[currentQuestion];

            if (!answer) return;

            let isCorrect = true;
            if (q.correct) {
                isCorrect = answer === q.correct.toUpperCase();
            }

            answers.push({ question: q.id, correct: isCorrect, answer: answer });
            if (isCorrect) score++;

            showFeedback(isCorrect, q.correct || "Réponse enregistrée");

            input.disabled = true;
            document.getElementById('submit-text').disabled = true;

            setTimeout(nextQuestion, 2000);
        }

        function handleMatching() {
            const q = questions[currentQuestion];
            let isCorrect = true;

            for (const pair of q.pairs) {
                if (matchingAnswers[pair.term] !== pair.definition) {
                    isCorrect = false;
                    break;
                }
            }

            answers.push({ question: q.id, correct: isCorrect });
            if (isCorrect) score++;

            showFeedback(isCorrect, "Toutes les correspondances sont correctes");

            document.getElementById('submit-matching').disabled = true;
            document.querySelectorAll('select').forEach(s => s.disabled = true);

            setTimeout(nextQuestion, 2000);
        }

        function showFeedback(isCorrect, correctAnswer) {
            const feedback = document.getElementById('feedback');
            const config = window.elementSdk ? window.elementSdk.config : defaultConfig;

            if (isCorrect) {
                feedback.innerHTML = `
                    <div class="p-4 rounded-lg" style="background-color: #10b981;">
                        <p class="body-text font-bold">✓ Correct ! Bien joué ! 🎉</p>
                    </div>
                `;
            } else {
                feedback.innerHTML = `
                    <div class="p-4 rounded-lg" style="background-color: #ef4444;">
                        <p class="body-text font-bold">✗ Incorrect</p>
                        <p class="body-text">La bonne réponse : ${correctAnswer}</p>
                    </div>
                `;
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                endQuiz();
            } else {
                render();
            }
        }

        async function endQuiz() {
            clearInterval(timerInterval);
            const timeTaken = Math.floor((Date.now() - startTime) / 1000);

            quizState = "results";

            const formData = new FormData();
            formData.append('prénom', studentFirstName);
            formData.append('nom', studentLastName);
            formData.append('classe', studentClass);
            formData.append('score', `${score}/${questions.length}`);
            formData.append('temps_secondes', timeTaken);

            try {
                const response = await fetch('https://formspree.io/f/mgvglylz', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    console.error("Erreur lors de l'envoi du formulaire Formspree");
                }

                console.error("Erreur lors de l'envoi des résultats :", error);
            }

            render();

                message = "Très bien !";
            }

            app.innerHTML = `

                    <div class="max-w-4xl mx-auto">

                                    <p class="body-text mb-2">Score</p>

                                    <p class="body-text mb-2">Temps</p>
                                    <p class="title font-bold">${minutes}:${seconds.toString().padStart(2, '0')}</p>
                                </div>
                                <div class="p-6 rounded-xl" style="background-color: ${config.surface_color || defaultConfig.surface_color}; border: 2px solid ${config.primary_action_color || defaultConfig.primary_action_color};">
                                    <p class="body-text mb-2">Étudiant</p>
                                    <p class="subtitle font-bold">${studentFirstName} ${studentLastName}</p>
                                </div>
                            </div>

                            <button id="restart-btn" class="primary-btn px-8 py-4 rounded-lg font-bold hover:opacity-90">
                                Recommencer 🔄
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('restart-btn').addEventListener('click', () => {
                currentQuestion = 0;
                score = 0;
                answers = [];
                timeLeft = 1800;
                quizState = "intro";
                render();

            updateUI(config);
